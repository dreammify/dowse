name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Verify generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code || (echo "Generated code is out of date. Run 'go generate ./...' and commit." && exit 1)

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "Code is not formatted. Run 'gofmt -s -w .'" && gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath -o /dev/null ./cmd/dowse

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-file: go.mod
          go-package: ./...

  integration-gopls:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Run gopls integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=120s -run='TestGopls' ./internal/integration/

  integration-kotlin-lsp:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install kotlin-lsp
        run: |
          curl -fsSL -o kotlin-lsp.zip "https://download-cdn.jetbrains.com/kotlin-lsp/261.13587.0/kotlin-lsp-261.13587.0-linux-x64.zip"
          unzip -q kotlin-lsp.zip -d "$HOME/kotlin-lsp"
          chmod +x "$HOME/kotlin-lsp/kotlin-lsp.sh"
          ln -s "$HOME/kotlin-lsp/kotlin-lsp.sh" /usr/local/bin/kotlin-lsp

      - name: Pre-fetch Gradle dependencies
        working-directory: sample-projects/kotlin
        run: ./gradlew dependencies --no-daemon

      - name: Run kotlin-lsp integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=300s -run='TestKotlin_' ./internal/integration/

  integration-jdtls:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install jdtls
        run: |
          curl -fsSL -o jdtls.tar.gz "https://www.eclipse.org/downloads/download.php?file=/jdtls/milestones/1.56.0/jdt-language-server-1.56.0-202601291528.tar.gz"
          mkdir -p "$HOME/jdtls"
          tar -xzf jdtls.tar.gz -C "$HOME/jdtls"
          ln -s "$HOME/jdtls/bin/jdtls" /usr/local/bin/jdtls

      - name: Pre-fetch Gradle dependencies
        working-directory: sample-projects/java
        run: ./gradlew dependencies --no-daemon

      - name: Run jdtls integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=300s -run='TestJdtls' ./internal/integration/

  integration-sorbet:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252 # v1.229.0
        with:
          ruby-version: '3.3'

      - name: Install Sorbet
        run: gem install sorbet sorbet-runtime

      - name: Run Sorbet integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=300s -run='TestSorbet' ./internal/integration/

  integration-excalidraw:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install typescript-language-server
        run: npm install -g typescript-language-server typescript

      - name: Install excalidraw dependencies
        working-directory: sample-projects/excalidraw
        run: yarn install

      - name: Run excalidraw integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=300s -run='TestExcalidraw' ./internal/integration/

  integration-zustand:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install typescript-language-server
        run: npm install -g typescript-language-server typescript

      - name: Install zustand dependencies
        working-directory: sample-projects/zustand
        run: pnpm install

      - name: Run zustand integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=300s -run='TestZustand' ./internal/integration/

  integration-redisson:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install jdtls
        run: |
          curl -fsSL -o jdtls.tar.gz "https://www.eclipse.org/downloads/download.php?file=/jdtls/milestones/1.56.0/jdt-language-server-1.56.0-202601291528.tar.gz"
          mkdir -p "$HOME/jdtls"
          tar -xzf jdtls.tar.gz -C "$HOME/jdtls"
          ln -s "$HOME/jdtls/bin/jdtls" /usr/local/bin/jdtls

      - name: Run redisson integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=300s -run='TestRedisson' ./internal/integration/

  integration-mockito:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install jdtls
        run: |
          curl -fsSL -o jdtls.tar.gz "https://www.eclipse.org/downloads/download.php?file=/jdtls/milestones/1.56.0/jdt-language-server-1.56.0-202601291528.tar.gz"
          mkdir -p "$HOME/jdtls"
          tar -xzf jdtls.tar.gz -C "$HOME/jdtls"
          ln -s "$HOME/jdtls/bin/jdtls" /usr/local/bin/jdtls

      - name: Pre-fetch Gradle dependencies
        working-directory: sample-projects/mockito
        run: ./gradlew :mockito-core:dependencies --no-daemon

      - name: Run mockito integration tests
        run: go test -v -race -count=1 -tags=integration -timeout=1500s -run='TestMockito' ./internal/integration/

  # integration-kotlinx-coroutines: disabled — kotlin-lsp does not support
  # semantic analysis for Kotlin Multiplatform projects.

  # integration-okhttp: disabled — kotlin-lsp does not support
  # semantic analysis for Kotlin Multiplatform projects.
